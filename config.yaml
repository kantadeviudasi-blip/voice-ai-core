# Voice AI Platform Configuration
# Lean Self-Hosted & Low-Cost Pipeline

server:
  host: "0.0.0.0"
  port: 8000
  log_level: "info"

pipeline:
  default_stt: "deepgram"
  default_llm: "gemini"
  default_tts: "sarvam"

stt:
  deepgram:
    api_key: "${DEEPGRAM_API_KEY}"
    model: "nova-3"
    language: "hi"

llm:
  gemini:
    api_key: "${GEMINI_API_KEY}"
    model: "gemini-3.8-flash"
    temperature: 0.25
    max_tokens: 120

tts:
  sarvam:
    api_key: "${SARVAM_API_KEY}"
    model: "bulbul:v3"
    speaker: "ritu"
    target_language_code: "hi-IN"
    sample_rate: 8000
    pace: 1.0
  deepgram:
    api_key: "${DEEPGRAM_API_KEY}"
    model: "aura-2-asteria-en"
    sample_rate: 24000

vad:
  chunk_duration_ms: 20
  sample_rate: 16000
  silence_threshold_ms: 450
  confidence_threshold: 0.55
  speech_onset_ms: 100
  min_utterance_speech_ms: 250
  barge_in_enabled: true

telephony:
  provider: "sip"
  sample_rate: 8000
